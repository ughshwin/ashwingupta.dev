name: Production searchability
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.production_environment == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fixed production host: never take a request target from webhook input.
      - run: node scripts/verify-seo-live.mjs
